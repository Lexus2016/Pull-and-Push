name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:        # allow manual runs

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS: the suite and start.sh --check run on the release Mac (macos/release.sh) — macOS
        # runners queued for hours here while the app is built and tested locally anyway
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"   # also exercise the minimum supported version
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev + web extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The bot sandbox runs with --pull=never (no network while an untrusted bot runs), so its image
      # must be present up front. Linux runners only: Windows runners are in Windows-container mode.
      - name: Pull the bot-sandbox image (lets the Docker sandbox tests run)
        if: runner.os == 'Linux'
        run: docker pull python:3.11-slim

      - name: Run tests
        run: python -m pytest -q

      # Smoke-test that the dashboard actually starts and serves on each OS.
      - name: Dashboard smoke (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pull-and-push web --host 127.0.0.1 --port 8799 &
          SP=$!
          ok=0
          for i in $(seq 1 30); do
            if python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8799/',timeout=1).status==200 else 1)" 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          kill $SP 2>/dev/null || true
          test "$ok" = "1" && echo "dashboard 200 OK" || { echo "dashboard did not serve 200"; exit 1; }

      - name: Dashboard smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "pull-and-push" -ArgumentList "web","--host","127.0.0.1","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              if ((Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8799/" -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($ok) { "dashboard 200 OK" } else { Write-Error "dashboard did not serve 200"; exit 1 }

  # Exercise the documented one-command installers (start.sh / start.ps1) themselves on each OS,
  # using --check (create venv + install, verify import, skip the blocking launch).
  launcher:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]    # macOS: macos/release.sh runs it on the release Mac
    steps:
      - uses: actions/checkout@v4
      - name: start.sh --check (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: ./start.sh --check
      - name: start.ps1 --check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./start.ps1 --check

  # The macOS app: built ad-hoc (no certificate in CI) and self-tested headless — the dashboard in
  # the app's own WKWebView, the native bridge, confirm(), a real download, and the engine exiting
  # with the app on Quit and on SIGKILL (macos/selftest.sh).
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Pull-and-Push.app (ad-hoc signed)
        run: PP_HOST_PYTHON="$(command -v python)" macos/build.sh --ad-hoc
      - name: Self-test the app
        run: macos/selftest.sh
