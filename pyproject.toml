[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tyani-tolkai"
version = "0.1.0"
description = "Adversarial co-evolution agent orchestrator (asymmetric MVP)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
tyani-tolkai = "tyani_tolkai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
